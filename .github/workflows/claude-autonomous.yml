name: Claude 자율 개발 (정기/수동)

# kafa 를 자체적으로 점진 개선한다: 플레이북(.github/AUTONOMOUS_DEV.md)을 읽고
# 데이터가 필요 없는 작업 하나를 골라 브랜치에서 구현→테스트→PR 생성(자동 병합 없음).
# 인증: 구독 OAuth 토큰. 스케줄 트리거는 기본 브랜치(main)에서만 동작.

on:
  schedule:
    - cron: "37 0 * * 1"         # 매주 월요일 09:37 KST (00:37 UTC) — 정시(:00) 혼잡 회피
  workflow_dispatch:
    inputs:
      task:
        description: "이번에 진행할 작업(비우면 플레이북에서 자동 선택)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

# 동시 실행 방지(중복 PR 방지)
concurrency:
  group: claude-autonomous
  cancel-in-progress: false

jobs:
  autonomous:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}   # gh CLI 인증(방향 이슈 읽기용)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 전체 히스토리(분석용)

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: "main"
          branch_prefix: "claude/auto/"
          prompt: |
            저장소: ${{ github.repository }}
            너는 kafa 프로젝트를 자율적으로 점진 개선한다.

            먼저 읽어라: README.md, CLAUDE.md, docs/decisions.md, .github/AUTONOMOUS_DEV.md.
            .github/AUTONOMOUS_DEV.md 의 규칙과 우선순위를 반드시 따른다.

            [방향 우선] 담당자가 적어둔 방향 지시를 먼저 확인하라:
              gh issue list --state open --search "자율 개발 방향 in:title" --json number,title
              결과가 있으면 `gh issue view <번호> --comments` 로 본문과 코멘트를 읽고,
              그 지시(담당자가 한국어로 적어둠)를 이번 작업의 **최우선 지침**으로 삼는다(플레이북보다 우선).
              지시가 없거나 비어 있으면 아래 '요청 작업' 또는 플레이북 우선순위를 따른다.
              단, 방향 지시도 보안 제0원칙·보류 추측 금지·PR전용 가드레일은 절대 위반하지 않는다.

            요청 작업(비어 있으면 위 방향 지시 또는 플레이북 우선순위로 네가 하나 선택):
            "${{ github.event.inputs.task }}"

            진행 방식:
            1. 이미 열려 있는 'claude/auto/*' PR 이 있으면 새 작업을 만들지 말고 끝낸다(중복 방지).
            2. 데이터가 있어야 확정되는 보류 항목(개인 상대계정/카면 의제/간이과세/봉사료·거래구분
               실제값/계정과목 시트 실제 매핑)은 추측으로 확정하지 말 것 — 골격/플래그만.
            3. 작고 명확한 변경 하나만. 새 브랜치에서 작업한다.
            4. 의존성 설치 후 테스트 전부 통과 확인:
               pip install -e ".[mcp]" && python -m pytest -q
            5. 변경 근거를 docs/decisions.md 변경 이력에 한 줄 추가.
            6. PR 을 생성한다(본문: 무엇을/왜/테스트 결과). **병합은 하지 않는다.**

            보안 제0원칙: 원천 PII(사업자번호·거래처 실명)는 절대 사용·커밋하지 않는다.
            테스트는 합성(가짜) 데이터만 쓴다. 실제 위하고 엑셀이 있어도 내용을 열어 컨텍스트에
            올리지 않는다.
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Edit,Write,Bash"
