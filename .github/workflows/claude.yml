name: Claude (대화형 @claude)

# 이슈/PR 에 "@claude ..." 로 멘션하면 Claude 가 응답·작업한다.
# 인증: Claude 구독 OAuth 토큰(CLAUDE_CODE_OAUTH_TOKEN) — 별도 API 토큰 과금 없음.
# 활성화 조건: 이 워크플로가 기본 브랜치(main)에 있어야 하고, GitHub App 설치 +
#   리포지토리 시크릿 CLAUDE_CODE_OAUTH_TOKEN 등록이 필요(아래 .github/AUTONOMOUS_DEV.md 참고).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Edit,Write,Bash"
