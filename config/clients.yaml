# 수임처(고객) 속성 — 담당자가 아는 사실을 적는 곳. 자료로는 알 수 없다.
#
# 왜 필요한가(담당자 확인 2026-08-07):
#   "직원이 없으면 복리후생비가 성립하지 않는다" → 1인 사업자는 마트·편의점·식사 같은
#   소액이 복리후생비가 아니라 **접대비**로 간다. 즉 같은 업종이라도 수임처 속성에 따라
#   계정이 갈린다. 또 개인/법인은 처리 방식 자체가 다르다(아래).
#
# 개인 vs 법인:
#   법인 — 카드 부채(미지급비용)를 계상해야 통장과 맞으므로 **전부 반영**.
#   개인 — 상대계정 불필요. 업무무관 건은 담당자가 **제외**(현재 자동 제외는 미구현).
#
# client_id 는 파이프라인의 고객 폴더명(inbox/<client_id>/)과 같아야 한다.

defaults:
  client_type: corporate      # corporate | individual
  has_employees: true         # false 면 복리후생비 성립 안 함(추천 시 검토 플래그)

clients: {}
  # 예시 — 실제 수임처를 아는 사람이 채운다:
  # 고객001:
  #   client_type: individual
  #   has_employees: false
  #   note: 1인 사업자 — 복리후생비 대신 접대비로 처리해 옴
  # 고객002:
  #   client_type: corporate
  #   has_employees: true
  #   note: 인테리어, 현장 많아 거래처 다수
