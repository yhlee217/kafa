# 대행사별 '실제 가맹점 되찾기' 경로.
#
# PG 조회 API 는 쓸 수 없다 — 다날·토스페이먼츠·KCP 개발자센터의 조회 API 는 전부
# **가맹점용**이다(MID·시크릿키 필요, 돌려주는 건 그 가맹점의 매출). 우리 수임처는
# 결제한 쪽이라 관계의 방향이 반대다. 난이도가 아니라 구조의 문제다.
#
# 대신 카드내역에 PG 이름만 떠서 곤란한 소비자를 위한 **조회 페이지**가 있다.
# 대개 승인번호가 필요하고, 승인번호는 카드사 이용내역에서 얻는다(1단계).
#
# `확인` = 2026-09-06 공개 자료로 주소·입력항목을 확인함.
#          주소가 바뀔 수 있으니 실패하면 추측하지 말고 사람에게 묻는다.

routes:
  pg_page:
    설명: "PG 소비자용 조회 페이지. 승인번호로 상호·상품명까지 나온다"
    sites:
      토스페이먼츠:
        주소: "https://www.tosspayments.com/ 고객센터 → 결제내역조회"
        입력: [승인번호 8자리, "또는 카드번호+결제일자+결제금액"]
        관문: []
        확인: 부분      # 조회 방식은 확인, 직접 URL 은 미확인
      엔에이치엔한국사이버결제:
        주소: "https://www.kcp.co.kr/viewPaymentParent/viewPayment/"
        입력: [카드번호 일부, 승인번호, 결제금액, 결제일자]
        관문: [보안문자]
        확인: 확인
      케이지이니시스:
        주소: "https://www.inicis.com/payment-view"
        입력: [지불수단별 정보]
        관문: []
        확인: 확인
      나이스페이먼츠:
        주소: "https://www.nicepay.co.kr/cs/transInfo/cardList.do"
        입력: [승인번호]
        관문: []
        확인: 확인
      다날:
        주소: "https://www.danalpay.com/customer_support/views_payments_step1"
        입력: [본인인증]
        관문: [본인인증, "평일 09:00~18:00 만 운영"]
        확인: 확인

  app_order:
    # 여기는 PG 조회가 아니라 **그 앱의 주문내역**이 정답이다. 품목까지 남는다.
    # 다만 수임처 대표 개인 계정이라 세무대리인이 직접 볼 수 없다 — 자료를 받아야 한다.
    설명: "간편결제·오픈마켓. 앱 주문내역에 실판매자와 품목이 있다"
    대행사: [쿠팡페이, 쿠팡, 네이버파이낸셜, 네이버페이, 카카오페이,
            스마일페이먼츠, 지마켓, 십일번가, 우아한형제들, 쿠팡이츠서비스]
    관문: [수임처 본인 계정]

  van_statement:
    # VAN 사는 소비자용 조회가 빈약하다. 카드사 이용내역 쪽이 낫다.
    설명: "VAN(카드 단말기). 소비자 조회 창구가 없거나 빈약 — 카드사 내역이 낫다"
    대행사: [한국정보통신, 나이스정보통신, 스마트로, 다우데이타, 케이에스넷,
            한국결제네트웍스, 코밴, 퍼스트데이터]
    관문: []

  giro:
    # 실측: 금융결제원 51건 4,463만원은 PG 결제가 아니라 **지로·사회보험료** 였다
    # (품명에 '2024년4월사회보험료'). 이미 전부 불공제로 처리돼 있고 40건은 세액 0이다.
    # 조회할 게 아니라 고지서로 확인하고 계정만 정하면 된다 — 2단계 대상이 아니다.
    설명: "지로·자동납부(사회보험료 등). 조회 대상이 아니고 고지서로 확인한다"
    대행사: [금융결제원]
    관문: []
    조회제외: true

# 건별 조회라 전부 할 수 없다. 금액 큰 것부터 한다.
# 실측(수집분 1,149건): 상위 5%(57건)가 금액의 71%, 1만원 미만 278건은 금액의 1.5%.
# 2단계가 필요 없는 갈래 — 교통은 자동 확정되고, 카드사청구는 연회비·수수료라
# 조회할 실가맹점이 없다.
skip_groups: [교통·선불정산, 카드사청구, 주차·모빌리티]

priority:
  min_amount: 30000      # 이 미만은 기본적으로 조회하지 않는다
  top_n: 60              # 금액 상위 몇 건을 우선 목록에 담을지
