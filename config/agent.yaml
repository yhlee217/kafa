# 세무대리인 보조 업무(kafa/agent) 설정 — 율·목록 외부화(코드 하드코딩 금지).
# 보안 제0원칙: 여기엔 PII 없음. 율/한도/유형 목록만 둔다.

# 초안3) 원천징수 — 유형별 소득세율(지급액 기준). 지방소득세 = 소득세의 10%.
# 주의: 기본율만. 비거주자·감면·소액부징수 적용범위·4대보험·필요경비율 변동은 보류(담당자 확인).
withholding:
  지방소득세_소득세대비율: 0.1
  소액부징수_기준: 1000        # 소득세 < 기준 → 소액부징수 검토(징수 제외 가능성)
  유형:
    사업소득:
      소득세율: 0.03
      설명: 인적용역 사업소득(프리랜서·강사 등) — 소득세 3% + 지방세 0.3% = 3.3%
    기타소득:
      소득세율: 0.08
      설명: 일반 기타소득(필요경비 60% 가정) — 실효 8.8%

# 초안4) 월별 자료 수취 체크리스트 — 고객에게 매달 받아야 하는 자료 유형(기본 세트).
intake:
  자료유형:
    - 신용카드 매입내역
    - 매입 세금계산서
    - 매출 세금계산서/계산서
    - 현금영수증 내역
    - 통장 거래내역
    - 인건비/급여 자료
