# config/account_codes.yaml
# 1.7 [확정] 계정명(한글) → 계정코드(숫자) 매핑.
#
# 이 파일은 검증된 일부 매핑이다. 전체 매핑은 업로드 양식의 '계정과목(참고용)'
# 시트를 파싱해 자동 생성·머지한다 (kafa/io_wehago/account_sheet.py).
# 시트 미확보 상태이므로 지금은 아래 검증분만 사용한다. ([보류])
#
# 주의: 다운로드본 계정명은 (제)/(판) 접두로 제조원가/판관비를 구분한다.
#   예) "(제)복리후생비"=511, "(판)복리후생비"=811, "(판)차량유지비"=822
#   accounts.map_account_name_to_code 가 접두/접미 표기를 모두 정규화해 매칭한다.

account_name_to_code:
  # 상대계정 / 자산·부채
  미지급비용: 262
  미지급금: 253
  외상매입금: 251
  선급금: 131
  현금: 101
  가지급금: 134
  # 비용 — (제)=제조원가, (판)=판매관리비
  "(제)복리후생비": 511
  "(판)복리후생비": 811
  "(제)원재료비": 501
  재료비: 501
  "(판)차량유지비": 822
