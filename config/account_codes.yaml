# config/account_codes.yaml
# 1.7 [확정] 계정명(한글) → 계정코드(숫자) 매핑.
#
# 출처: 위하고 SmartA '계정과목 및 적요 추출'(기초데이터 › 계정과목) — 2026-08 수령.
#       업로드 양식의 '계정과목(참고용)' 시트보다 **이 추출본이 정본**이다.
#       (양식 안내문: "SmartA10에서 계정과목명을 수정한 경우 SmartA10의 변경된
#        계정코드로 사용하셔야 합니다")
#
# 접두 마커는 코드 대역에서 유도 — 5xx 제조(제) · 6xx 도급(도) · 7xx 분양(분) ·
# 8xx 판관비(판). 그 외 대역(자산·부채·매출·영업외)은 접두 없음.
# 마스터의 계정명에는 마커가 없고 같은 이름이 대역별로 반복된다(복리후생비 511/611/711/811).
#
# 같은 키에 코드가 둘 이상인 23건과 '회사설정계정과목'(사용자 정의 자리표시자)은
# 제외했다 — 이름만으로 코드를 확정할 수 없어 추측하느니 미매핑으로 두고 확인받는다.
#
# ⚠️ 이 코드표는 **해당 사무소/회사의 SmartA 설정** 기준이다. 다른 회사에서 계정과목을
#    수정했다면 그 회사 추출본으로 교체해야 한다(예: 이 회사는 122가 회사설정계정과목).

