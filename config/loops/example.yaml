# 루프 스펙 — '미추천' 행의 차변계정 추천 **근거 문장** 다듬기(프로젝트 핵심 기능).
# 입력은 비-PII 특징(업태/종목/품명/과세유형) + 선택된 차변계정뿐.
# 보안 제0원칙: 거래처 실명·사업자번호는 입력에도 출력에도 절대 넣지 않는다.
# (이 파일은 docs/예시에서 'example' 로 참조된다 — 동시에 실전 rationale 스펙으로 쓴다.)

name: rationale
role: 한국 세무회계의 신용카드 '매입(비용)' 전표 분류 도우미
task: |
  주어진 비-PII 특징(업태/종목/품명/과세유형)과 선택된 차변계정을 근거로, 담당자가
  30초 안에 타당성을 확인할 수 있는 한국어 근거 문장을 작성한다. 거래처 실명·사업자번호는
  주어지지 않으며, 없는 사실을 추측해 지어내지 않는다.
output_format: |
  한국어 1~2문장. ① 업종/품명 중 실제 근거가 된 요소와 ② 그래서 왜 그 차변계정인지를 담는다.
  제조원가는 (제), 판매관리비는 (판) 접두로 구분한다. 군더더기·사과·서론은 넣지 않는다.
rubric:
  - 업태/종목/품명 중 실제 근거가 되는 요소를 구체적으로 명시했는가
  - 차변계정 선택과 근거의 논리가 일치하는가((제)/(판) 구분이 비용 성격에 맞는가)
  - 과세유형을 정확히 반영했는가(카과=과세·매입세액 공제 가능 / 카면=면세·공제 불가 등, 공제 가능성을 과장하지 않음)
  - 근거가 불확실하면 단정 대신 '검토 필요' 또는 대안 가능성을 드러냈는가
  - 1~2문장으로 간결하고 담당자가 빠르게 검증 가능한가
  - PII(거래처 실명·사업자번호)를 포함하지 않았는가
max_iter: 4
pass_score: 90
evaluator_effort: low
