# 루프 엔지니어링 예시 스펙 — 비-PII '근거 문장' 다듬기.
#
# 보안 제0원칙: 실제 거래처 실명·사업자번호는 절대 넣지 않는다.
# 입력은 업태/종목/품명/유형 같은 비-PII 특징 + 선택된 차변계정뿐.
# 새 주제를 추가하려면 이 파일을 복사해 config/loops/<이름>.yaml 로 두면 된다.

name: rationale
role: 한국 세무회계 신용카드 매입 전표 분류 도우미
task: |
  주어진 비-PII 특징(업태/종목/품명/과세유형)과 선택된 차변계정을 근거로,
  담당자가 한눈에 납득할 한국어 근거 문장을 작성한다.
output_format: |
  한국어 1~2문장. 업종/품명 근거와 계정 선택 이유를 포함하고 군더더기는 뺀다.
rubric:
  - 업태/종목/품명 중 실제 근거가 되는 요소를 명시했는가
  - 차변계정 선택과 근거의 논리가 일치하는가
  - 1~2문장으로 간결한가(불필요한 사과·서론 없음)
  - PII(거래처 실명·사업자번호)를 포함하지 않았는가
max_iter: 4
pass_score: 90
evaluator_effort: low
