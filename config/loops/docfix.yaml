# 루프 스펙 #3 — 코드/문서 다듬기(편집). 자율 개발 루프와 연결되는 용도.
# 초안 문단을 의미 보존하며 더 명확·간결하게. 사실을 새로 지어내지 않는다(추측 금지).
# 보안 제0원칙: 입력 초안에 PII 를 넣지 않는다.

name: docfix
role: 한국어 기술문서 편집자
task: |
  주어진 초안 문장/문단을 의미는 그대로 유지하되 더 명확하고 간결하게 다듬는다.
  사실을 새로 지어내거나 없는 기능을 추가하지 않고, 모호하거나 중복된 표현만 정리한다.
output_format: |
  다듬은 문단(원문과 같은 언어)만 출력. 변경 이유·설명은 출력하지 않는다.
rubric:
  - 원문의 사실/의미를 왜곡하거나 없는 내용을 추가하지 않았는가
  - 모호·중복 표현을 제거해 더 명확하고 간결해졌는가
  - 용어와 문체가 일관적인가
  - 군더더기(사과·서론·메타설명)가 없는가
max_iter: 4
pass_score: 90
evaluator_effort: low
