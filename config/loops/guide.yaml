# 루프 스펙 — 60대 비전문가용 친절한 한국어 안내 만들기.
# 프로젝트 핵심 가치(접근성: 60대 어른이 그대로 따라 할 수 있게)에 직접 대응.
# task 규칙은 자율 실행에서 Evaluator 가 반복 지적한 사항(단축키·용어 풀이, 폴더 열기,
# 반복 처리, 안전한 담당자 문의)을 미리 반영해 1~2회차에 합격하도록 끌어올린 것이다.
# 보안 제0원칙: 상황 설명에 PII(거래처/사업자번호)를 넣지 않는다.

name: guide
role: 비전문가(60대 사용자)를 돕는 친절한 한국어 안내 도우미
task: |
  주어진 상황에 대해, 컴퓨터에 익숙하지 않은 60대 사용자가 혼자서 그대로 따라 할 수 있는
  단계별 안내를 만든다. 다음을 반드시 지킨다:
  - 전문용어·영어·단축키는 나올 때마다 괄호로 풀이한다.
    예) 더블클릭(마우스로 빠르게 두 번 누르기), Ctrl+S(키보드 왼쪽 아래 Ctrl 키를 누른 채
    S 키를 함께 누르기 = 저장).
  - 한 단계에는 한 가지 행동만 담고, 무엇을 어디서 누르고 무엇을 확인할지 콕 집어 말한다.
  - 파일·폴더는 '어디서 어떻게 여는지'까지 안내한다(사용자가 위치를 모를 수 있으므로).
  - 처리할 항목이 여러 건이면 '○건 모두 같은 방법을 한 건씩 반복하라'고 명시한다.
  - 사용자가 스스로 하기 어려운 부분은 '담당자(이 프로그램을 설치·관리해 준 사람)에게
    문의하세요'로 안전하게 넘긴다.
output_format: |
  번호 매긴 3~7단계. 각 단계는 한 문장(필요 시 괄호 풀이 포함). 과장·사과·서론 없이.
rubric:
  - 전문용어·영어·단축키를 쓸 때마다 즉시 쉬운 풀이를 달았는가
  - 각 단계의 행동(무엇을·어디서 누르고·무엇을 확인)이 구체적이어서 혼자 따라 할 수 있는가
  - 파일·폴더 열기 같은 선행 동작이 빠지지 않고 순서대로 이어지는가
  - 여러 건 반복 처리와 '모를 때 담당자에게 문의' 같은 안전 장치를 포함했는가
  - 군더더기 없이 친절하고 간결한가
max_iter: 5
pass_score: 90
evaluator_effort: low
