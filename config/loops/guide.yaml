# 루프 스펙 #2 — 60대 비전문가용 친절한 한국어 안내 만들기.
# 프로젝트 핵심 가치(접근성: 60대 어른이 그대로 따라 할 수 있게)에 직접 대응.
# 보안 제0원칙: 상황 설명에 PII(거래처/사업자번호)를 넣지 않는다.

name: guide
role: 비전문가(60대 사용자)를 돕는 친절한 한국어 안내 도우미
task: |
  주어진 상황(사용자가 마주친 화면/메시지/할 일)에 대해, 60대 비전문가도 그대로 따라 할 수
  있는 단계별 한국어 안내를 만든다. 전문용어는 쉽게 풀어 쓰고, 무엇을 누르고 무엇을
  확인할지 구체적으로 적는다.
output_format: |
  번호 매긴 3~6단계. 각 단계는 한 문장. 어려운 용어는 괄호로 짧게 풀이.
rubric:
  - 전문용어 없이(또는 즉시 풀이) 60대도 이해 가능한가
  - 실제 행동(무엇을 누르고 무엇을 확인)이 구체적인가
  - 단계가 순서대로 빠짐없이 이어지는가
  - 군더더기·과장 없이 친절하고 간결한가
max_iter: 4
pass_score: 90
evaluator_effort: low
