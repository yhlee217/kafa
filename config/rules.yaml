# config/rules.yaml
# 위하고 T 신용카드 매입 전표 분류 규칙 (spec v4 §3 기준)
#
# 표시 규칙
#   [확정]  : 위하고 화면/양식으로 검증된 사실. 그대로 신뢰.
#   [AI]    : Claude 잠정 판단. 세무 전문가 최종 검수 전 (특히 키워드 목록).
#   [보류]  : 데이터 미확보. TODO 자리표시자. 진행을 막지 않음.

# 1.1 [확정] 과세유형 코드 (숫자 입력 → 라벨 표시). 불공제 전용 코드 없음.
vat_type_codes:
  일반: 3
  카과: 57
  카면: 58
  카영: 59
  화물: 63

# 1.1 유형 도출 규칙
vat_type_logic:
  과세_공제: 카과
  면세_공제: 카면        # [보류] 카면 실제 샘플로 검증
  불공제: 일반            # 불공제는 유형 일반(3) + 국세청 컬럼으로 구분

# 1.2 [확정] 대변(상대계정). 법인 두 샘플 모두 미지급비용(262), 거래처=카드사.
counterparty:
  corporate_client:
    account: 미지급비용
    code: 262
    vendor: 카드사        # 업로드 배치(어느 카드로 받았는지)로 귀속되는 것으로 추정
    # [확정 2026-11-26 담당자 통화] 법인 체크카드는 대변이 보통예금(103). 카드 자료에는 신용/체크
    # 구분이 안 나오지만, 위하고에 카드를 처음 등록할 때 체크카드는 상대계정을 보통예금으로,
    # 신용카드는 미지급으로 잡아 둔다 → 다운로드본 대변 칸이 이 코드면 그대로 둔다.
    keep_from_download_codes: [103]
  # [확정 2026-11-23 담당자 통화] 개인사업자는 **인출금(338)**. 미지급금은 잘 안 잡고,
  # 보통예금·현금으로 섞여 있으면 인출금 하나로 바꾼다. 수임처마다 크게 다르지 않고
  # 대표카드·사업용카드도 구분하지 않는다 → 검토 플래그를 뗀다(docs/domain_notes.md).
  individual_client:
    account: 인출금
    code: 338
    vendor: 카드사
    needs_review: false
    note: 담당자 확정(2026-11-23) — 개인사업자 카드 사용분 대변은 인출금(338).
  default_client_type: corporate

# 1.3 [확정] 불공제 3단 분기. 국세청 컬럼은 자동추정값(참고). 담당자 오버라이드 가능.
non_deductible:
  # [확정 2026-11-23 담당자 통화] 공제 여부는 국세청 칸이 아니라 담당자가 위하고에서 정하는
  # '유형' 으로 가른다 — 카과는 매입매출(세액 공제), 일반은 일반전표(불공제). 국세청의
  # 공제·불공제 표시는 "의미가 별로 없다". 실측(33곳 7,943행): 유형과 국세청이 7.0% 어긋나고,
  # 처리된 행에서 8.8%·미처리 행에서 1.7% — 처리하면서 유형이 고쳐진다(docs/domain_notes.md).
  # 유형이 아래 표에 없거나 비어 있으면 예전처럼 국세청 칸을 따른다(카면·카영은 담당자 미확인).
  source: 유형                     # 유형 | 국세청_컬럼
  by_type:
    카과: 공제
    일반: 불공제
  # [확정 2026-11-23] 계정이 공제 여부를 정하는 경우 — 유형·국세청보다 우선.
  # 접대비(기업업무추진비)는 부가세법상 매입세액 불공제. 실측: 처리된 접대비 963건 중 카과 0건,
  # 처리 전 행에서는 접대비로 추천됐는데 공제로 나가는 행이 11건 있었다(docs/domain_notes.md).
  # 계정명에 이 말이 든 계정 전부 — (판)813·(제)513·(도)613·(분)713·해외접대비 843.
  by_account:
    접대비: 불공제
  auto: ["면세사업관련"]           # 룰 확정 자동 불공제
  flag_for_review:                # 의심 → 담당자 확인 (자동 확정 금지)
    - 비영업용승용차
    - 접대성업종
    - 사업무관의심
  simplified_taxpayer: TODO        # [보류] 다운로드 데이터에 간이/일반 식별자 유무 미확인
  # [확정 2026-08 담당자] "봉사료가 들어가는 건 접대성 경비 → 부가세와 무관, 다 불공제".
  # 다만 다운로드본 '비과세' 컬럼 = 봉사료 인지(동일성)는 아직 미확인([보류]) →
  # 불공제로 처리하되 검토 플래그를 남긴다. 동일성 확인되면 confirmed_identity: true.
  service_charge:
    non_deductible: true
    source_column: 비과세
    confirmed_identity: false
  # [AI] flag_for_review 판정용 키워드. 업태/종목/품명에 매칭되면 review 플래그.
  #      세무 전문가 검수 대상 — 같은 가맹점도 목적에 따라 갈리므로 자동 확정하지 않음.
  review_keywords:
    비영업용승용차: [주유, 주유소, 휘발유, 경유, LPG, 충전, 세차, 주차, 정비, 타이어, 엔진오일]
    접대성업종: [유흥, 단란, 노래, 골프, 룸살롱, 클럽, 접대]
    사업무관의심: []

# 수임처 속성 기반 점검 — 근거·배경은 docs/domain_notes.md 참고.
# 직원이 없는 수임처에서는 복리후생비가 성립하지 않는다(담당자 확인).
# 아래 계정으로 추천되면 검토 플래그만 남긴다(자동으로 바꾸지 않음).
client_profile_checks:
  welfare_account_codes: [511, 611, 711, 811]   # 복리후생비(제조/도급/분양/판관)
  # 수임처별 식대 계정 — 담당자가 수임처마다 식대를 다른 계정으로 처리한다(조사표 메모 2026-11-26:
  # 1곳은 접대비, 2곳은 촬영비). 수임처 속성(~/.kafa/clients.yaml)의 meal_account 로 지정한다
  # (`kafa-clients meal`). **프로그램이 추천한** 복리후생비 중 식대인 행만 바꾼다 —
  # 위하고·담당자가 이미 채운 행은 그대로 둔다. 근거·배경은 docs/domain_notes.md.
  meal_override:
    from_account_codes: [511, 611, 711, 811]    # 이 계정으로 추천됐을 때만 바꾼다(복리후생비)
    # 식대로 보는 업종 — 종목에 이 말이 있으면(종목이 비면 업태로 본다). 숙박은 넣지 않는다.
    meal_keywords: [음식, 식당, 한식, 중식, 일식, 양식, 분식, 카페, 커피, 제과, 베이커리,
                    치킨, 피자, 주점, 호프, 뷔페, 면옥, 국밥, 횟집, 도시락, 패스트푸드, 레스토랑]

# 1.6 의제매입세액 — 플래그만 (율/한도 계산 금지)
restaurant_deemed_credit:
  judge_by: 고객사_업종            # 가맹점 업태/종목 아님 (별도 회사정보 필요)
  client_is_restaurant: TODO       # [보류] 고객사 음식점업 여부. 회사정보 확보 시 채움.
  emit: flag_only                  # 율/세액 계산 안 함. 부가세 신고 단계로 이관.

# 1.8 [확정] 중복전표 스킵
# '담당자제외' = 아버님 답지에서 '올리지 않음' 을 고른 행(kafa-desk) — 업로드본에서 빠지고 스킵으로 집계
skip_status: ["중복전표", "담당자제외"]

# Phase 2 대상
recommend_target_status: ["미추천"]

# 2 [확정] 업로드 양식 필수값
required_output_fields: ["거래일자", "합계"]

# 1.7 (선택) '계정과목(참고용)' 시트 경로. 지정 시 계정명→코드 매핑에 자동 머지(config 우선).
#      null 이면 검증된 account_codes.yaml 만 사용. 시트 확보 시 여기에 경로를 적으면 됨.
account_sheet_path: null

# 2 출력 포맷 (.xls, xlwt). [보류] 위하고 .xlsx 업로드 허용 여부 미확인.
output_format: xls
output:
  transaction_type_default: ""     # 🤖 거래구분 허용값 미확정([보류]) → 공란 기본
  max_bytes: 2097152               # 2MB 초과 시 행 단위 자동 분할

# 1.9 환불/승인취소(음수): 원거래 분류 유지, 차·대변 방향 반전.
negative:
  reverse_direction: true

# Phase 2 미추천 추천
recommend:
  similarity_floor: 0.80           # 시드 유사도 폴백 임계
  similarity_confidence_cap: 0.60  # 유사도 기반 추천 신뢰도 상한
  # 업종 최빈 폴백 — **이 수임처가 그 업종을 처리해온 방식**을 이력에서 학습.
  # 기준이 수임처마다 다른 항목(예: 음식점 = 접대비냐 복리후생비냐)을 고객별로 흡수한다.
  # 근거가 약하므로 상한(cap)을 두고, 최소 건수·최소 편중을 못 넘으면 추천하지 않는다
  # (반반으로 갈리는 업종은 담당자 확인으로 넘긴다).
  industry_confidence_cap: 0.55
  industry_min_support: 3
  industry_min_ratio: 0.65
  # AI 차변계정 추정: 기본은 **Claude Desktop/Code의 호스트 모델**이 수행한다(별도 API 키·
  # 추가 토큰 청구 없음). MCP analyze→convert 흐름에서 호스트 Claude 가 비-PII 특징으로
  # 추정하고 결과만 넘긴다. 거래처/사업자번호는 모델에 전달되지 않는다.
  llm:
    enabled: false                 # true 로 켜면 별도 ANTHROPIC_API_KEY 로 직접 호출(추가 비용). 기본 off.
    model: claude-opus-4-8         # api 경로 사용 시 모델(변경 가능)
    # effort: low
    cache_path: null               # 결정 캐시 경로(같은 특징→같은 결과 재현)
  # 사무실 전체 이력 — 다른 수임처들이 같은 업종(업태|종목)을 처리한 계정. 수임처 이력 다음,
  # Claude 답 앞. 여러 수임처가 같은 쪽으로 처리한 업종에만 쓴다(건수 비중·수임처 비중 둘 다).
  # **측정 전에는 끈다** — `kafa-ask prior` 로 한 수임처씩 빼고 맞혀 본 정답률을 보고 켠다.
  # 2026-11-23 실측: 정답 76~79%, 미해소 1,320건 중 채움 7~85건 → 끈 채로 둔다(decisions.md).
  office_prior:
    enabled: false
    min_clients: 3                 # 그 업종을 처리한 다른 수임처가 이만큼 이상
    min_share: 0.8                 # 최다 계정의 건수 비중·수임처 비중 둘 다 이 이상
    confidence_cap: 0.6            # 리포트 신뢰도 상한(수임처 업종 이력 0.55 와 비슷한 급)
  # 운영 파이프라인용 호스트 Claude 추천(질문지↔답지 왕복, kafa-ask / docs/cowork_ask.md).
  # 미해소 행의 비-PII 특징(업태/종목/품명/유형)만 질문지로 내보내고, Claude 가 고른 계정을
  # 특징 서명 단위로 모아 둔다(<결과폴더>/_ai/picks.json). 이력·시드가 먼저고 이건 그다음이다.
  host_picks:
    enabled: true
    min_confidence: 0.5            # Claude 가 적은 확신이 이보다 낮으면 적용하지 않는다(미해소 유지)
    confidence_cap: 0.7            # 리포트 신뢰도 상한 — 자기보고 확신은 보정되지 않았다
    ask_before_run: true           # kafa-run: 새 질문이 있으면 분류 전에 멈추고 답을 기다린다

# Phase 4 검토 리포트
report:
  vat_rate_tol: 0.01               # 표준 부가율 10% 대비 허용 편차(절대). 초과 시 이상
  client_report: false             # 고객 제공용 요약(_client.txt) 생성 여부(선택). 기본 off.

# 결제대행사 — 거래처가 '실제 가맹점' 이 아니라 대행사로 찍히는 경우.
# 그 이름만으로는 무엇을 샀는지 알 수 없어 계정을 정할 수 없다(담당자 확인 2026-09-03).
# 실측(전표 7,738건): 42곳 / 1,651건 / 21.3% 가 여기 해당.
# 이름 표기가 제각각이라(전각 괄호·법인 표기·띄어쓰기) 정규화 후 부분일치로 본다.
# 배경: docs/domain_notes.md
payment_agents:
  flag_review: true          # 검토 플래그를 달아 담당자가 보게 한다
  # 대행사 건이라도 **그 수임처의 과거 처리가 일관되면** 자동으로 채운다.
  # 실제 가맹점은 끝내 알 수 없지만, 이 수임처가 그 대행사를 어떻게 처리해왔는지는
  # 이력으로 알 수 있다(담당자 요청 2026-09-03).
  auto_accept_confidence: 0.85   # 이 이상이면 검토 플래그를 떼고 자동 확정

  # 이름 목록만으로는 새로 생긴 대행사를 못 잡는다. 그런데 대행사는 **종목이
  # 스스로를 말한다** — '부가통신업', '전자지급결제대행', '전자금융업'.
  # 그래서 이름이 목록에 없어도 종목으로 한 번 더 거른다(근거: docs/domain_notes.md).
  # 통신 3사도 종목에 '부가통신'이 붙지만 그건 그냥 통신비다 — 아래 말로 제외한다.
  industry_exclude:
    - 이동전화
    - 무선호출
    - 전신전화
    - 유선통신
    - 통신설비

  groups:
    결제대행:
      note: "결제대행사라 실제 가맹점을 알 수 없습니다 — 영수증·명세로 확인 필요"
      # 종목에 이 말이 있으면 이름이 목록에 없어도 대행사로 본다.
      industry_keywords:
        - 부가통신
        - 결제대행
        - 지급결제
        - 전자금융
        - 전자결제
        - 통신과금
        - 금융지원
      keywords:
        # ── VAN(카드 단말기·승인 중계) — 가맹점 대신 이 회사 이름이 찍힌다
        - 한국정보통신
        - 나이스정보통신
        - 케이아이에스정보통신
        - 케이아이에스
        - 스마트로
        - 다우데이타
        - 케이에스넷
        - 한국결제네트웍스
        - 퍼스트데이타
        - 퍼스트데이터
        - 코밴
        - 제이티넷
        - 금융결제원
        # ── PG(전자지급결제대행) — 온라인·앱 결제
        - 토스페이먼츠
