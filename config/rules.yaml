# config/rules.yaml
# 위하고 T 신용카드 매입 전표 분류 규칙 (spec v4 §3 기준)
#
# 표시 규칙
#   [확정]  : 위하고 화면/양식으로 검증된 사실. 그대로 신뢰.
#   [AI]    : Claude 잠정 판단. 세무 전문가 최종 검수 전 (특히 키워드 목록).
#   [보류]  : 데이터 미확보. TODO 자리표시자. 진행을 막지 않음.

# 1.1 [확정] 과세유형 코드 (숫자 입력 → 라벨 표시). 불공제 전용 코드 없음.
vat_type_codes:
  일반: 3
  카과: 57
  카면: 58
  카영: 59
  화물: 63

# 1.1 유형 도출 규칙
vat_type_logic:
  과세_공제: 카과
  면세_공제: 카면        # [보류] 카면 실제 샘플로 검증
  불공제: 일반            # 불공제는 유형 일반(3) + 국세청 컬럼으로 구분

# 1.2 [확정] 대변(상대계정). 법인 두 샘플 모두 미지급비용(262), 거래처=카드사.
counterparty:
  corporate_client:
    account: 미지급비용
    code: 262
    vendor: 카드사        # 업로드 배치(어느 카드로 받았는지)로 귀속되는 것으로 추정
  # [확정 2026-08 담당자] 개인사업자는 **인출금 또는 미지급금**을 사용.
  # 계정과목 추출본에서 인출금 코드(338)를 확보 → 담당자가 먼저 언급한 인출금을 기본으로.
  # 둘 중 어느 쪽을 쓰는지 최종 확인 전까지 needs_review 유지(대안: 미지급금 253).
  individual_client:
    account: 인출금
    code: 338
    vendor: 카드사
    needs_review: true
    note: 담당자 확인(2026-08) — 개인은 인출금(338)/미지급금(253). 인출금 기본, 최종 확인 대기.
  default_client_type: corporate

# 1.3 [확정] 불공제 3단 분기. 국세청 컬럼은 자동추정값(참고). 담당자 오버라이드 가능.
non_deductible:
  source: 국세청_컬럼              # 기본값: 국세청 컬럼을 따른다
  auto: ["면세사업관련"]           # 룰 확정 자동 불공제
  flag_for_review:                # 의심 → 담당자 확인 (자동 확정 금지)
    - 비영업용승용차
    - 접대성업종
    - 사업무관의심
  simplified_taxpayer: TODO        # [보류] 다운로드 데이터에 간이/일반 식별자 유무 미확인
  # [확정 2026-08 담당자] "봉사료가 들어가는 건 접대성 경비 → 부가세와 무관, 다 불공제".
  # 다만 다운로드본 '비과세' 컬럼 = 봉사료 인지(동일성)는 아직 미확인([보류]) →
  # 불공제로 처리하되 검토 플래그를 남긴다. 동일성 확인되면 confirmed_identity: true.
  service_charge:
    non_deductible: true
    source_column: 비과세
    confirmed_identity: false
  # [AI] flag_for_review 판정용 키워드. 업태/종목/품명에 매칭되면 review 플래그.
  #      세무 전문가 검수 대상 — 같은 가맹점도 목적에 따라 갈리므로 자동 확정하지 않음.
  review_keywords:
    비영업용승용차: [주유, 주유소, 휘발유, 경유, LPG, 충전, 세차, 주차, 정비, 타이어, 엔진오일]
    접대성업종: [유흥, 단란, 노래, 골프, 룸살롱, 클럽, 접대]
    사업무관의심: []

# 수임처 속성 기반 점검 — 근거·배경은 docs/domain_notes.md 참고.
# 직원이 없는 수임처에서는 복리후생비가 성립하지 않는다(담당자 확인).
# 아래 계정으로 추천되면 검토 플래그만 남긴다(자동으로 바꾸지 않음).
client_profile_checks:
  welfare_account_codes: [511, 611, 711, 811]   # 복리후생비(제조/도급/분양/판관)

# 1.6 의제매입세액 — 플래그만 (율/한도 계산 금지)
restaurant_deemed_credit:
  judge_by: 고객사_업종            # 가맹점 업태/종목 아님 (별도 회사정보 필요)
  client_is_restaurant: TODO       # [보류] 고객사 음식점업 여부. 회사정보 확보 시 채움.
  emit: flag_only                  # 율/세액 계산 안 함. 부가세 신고 단계로 이관.

# 1.8 [확정] 중복전표 스킵
skip_status: ["중복전표"]

# Phase 2 대상
recommend_target_status: ["미추천"]

# 2 [확정] 업로드 양식 필수값
required_output_fields: ["거래일자", "합계"]

# 1.7 (선택) '계정과목(참고용)' 시트 경로. 지정 시 계정명→코드 매핑에 자동 머지(config 우선).
#      null 이면 검증된 account_codes.yaml 만 사용. 시트 확보 시 여기에 경로를 적으면 됨.
account_sheet_path: null

# 2 출력 포맷 (.xls, xlwt). [보류] 위하고 .xlsx 업로드 허용 여부 미확인.
output_format: xls
output:
  transaction_type_default: ""     # 🤖 거래구분 허용값 미확정([보류]) → 공란 기본
  max_bytes: 2097152               # 2MB 초과 시 행 단위 자동 분할

# 1.9 환불/승인취소(음수): 원거래 분류 유지, 차·대변 방향 반전.
negative:
  reverse_direction: true

# Phase 2 미추천 추천
recommend:
  similarity_floor: 0.80           # 시드 유사도 폴백 임계
  similarity_confidence_cap: 0.60  # 유사도 기반 추천 신뢰도 상한
  # 업종 최빈 폴백 — **이 수임처가 그 업종을 처리해온 방식**을 이력에서 학습.
  # 기준이 수임처마다 다른 항목(예: 음식점 = 접대비냐 복리후생비냐)을 고객별로 흡수한다.
  # 근거가 약하므로 상한(cap)을 두고, 최소 건수·최소 편중을 못 넘으면 추천하지 않는다
  # (반반으로 갈리는 업종은 담당자 확인으로 넘긴다).
  industry_confidence_cap: 0.55
  industry_min_support: 3
  industry_min_ratio: 0.65
  # AI 차변계정 추정: 기본은 **Claude Desktop/Code의 호스트 모델**이 수행한다(별도 API 키·
  # 추가 토큰 청구 없음). MCP analyze→convert 흐름에서 호스트 Claude 가 비-PII 특징으로
  # 추정하고 결과만 넘긴다. 거래처/사업자번호는 모델에 전달되지 않는다.
  llm:
    enabled: false                 # true 로 켜면 별도 ANTHROPIC_API_KEY 로 직접 호출(추가 비용). 기본 off.
    model: claude-opus-4-8         # api 경로 사용 시 모델(변경 가능)
    # effort: low
    cache_path: null               # 결정 캐시 경로(같은 특징→같은 결과 재현)

# Phase 4 검토 리포트
report:
  vat_rate_tol: 0.01               # 표준 부가율 10% 대비 허용 편차(절대). 초과 시 이상
  client_report: false             # 고객 제공용 요약(_client.txt) 생성 여부(선택). 기본 off.

# 결제대행사 — 거래처가 '실제 가맹점' 이 아니라 대행사로 찍히는 경우.
# 그 이름만으로는 무엇을 샀는지 알 수 없어 계정을 정할 수 없다(담당자 확인 2026-09-03).
# 실측(전표 7,738건): 42곳 / 1,651건 / 21.3% 가 여기 해당.
# 이름 표기가 제각각이라(전각 괄호·법인 표기·띄어쓰기) 정규화 후 부분일치로 본다.
# 배경: docs/domain_notes.md
payment_agents:
  flag_review: true          # 검토 플래그를 달아 담당자가 보게 한다
  # 대행사 건이라도 **그 수임처의 과거 처리가 일관되면** 자동으로 채운다.
  # 실제 가맹점은 끝내 알 수 없지만, 이 수임처가 그 대행사를 어떻게 처리해왔는지는
  # 이력으로 알 수 있다(담당자 요청 2026-09-03).
  auto_accept_confidence: 0.85   # 이 이상이면 검토 플래그를 떼고 자동 확정
  groups:
    결제대행:
      note: "결제대행사라 실제 가맹점을 알 수 없습니다 — 영수증·명세로 확인 필요"
      keywords:
        - 한국정보통신
        - 토스페이먼츠
        - 엔에이치엔한국사이버결제
        - 엔에이치엔케이씨피
        - 나이스정보통신
        - 네이버파이낸셜
        - 케이지이니시스
        - 스마트로
        - 카카오페이
        - 코페이
        - 스마일페이먼츠
        - 쿠팡페이
        - 다날
        - 금융결제원
        - 섹타나인
        - 케이에스넷
        - 헥토파이낸셜
        - 갤럭시아머니트리
        - 갤럭시아커뮤니케이션즈
        - 페이레터
        - 세틀뱅크
        - 올더게이트
        - 퍼스트데이타
    교통·선불정산:
      note: "교통·선불 정산사업자입니다 — 대개 여비교통비로 처리"
      # 성격이 분명한 갈래는 자동 확정(담당자 확인 2026-09-03: 교통은 문제없음).
      # 차변계정이 비어 있을 때만 채운다 — 위하고가 채운 값은 건드리지 않는다.
      default_account: 812        # (판)여비교통비
      auto_confirm: true
      keywords:
        - 티머니모빌리티
        - 티머니
        - 한국스마트카드
        - 이비카드
        - 이동의즐거움
        - 경기도버스운송사업조합
        - 한국도로공사
        - 코레일유통
        - 로카모빌리티
        - 마이비
    카드사청구:
      note: "카드사가 직접 청구한 건입니다 — 연회비·수수료인지 확인 필요"
      keywords:
        - 삼성카드
        - 신한카드
        - 현대카드
        - KB국민카드
        - 국민카드
        - 롯데카드
        - 하나카드
        - 우리카드
        - 비씨카드
        - 농협카드
