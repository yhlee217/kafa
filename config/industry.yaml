# 업태·종목 표기 통일 — 같은 업종이 여러 표기로 와서 이력이 쪼개지는 문제.
#
# 왜 필요한가: 업종 시드 키는 업태 문자열을 그대로 쓴다. 그런데 실제 자료에는
# `소매업`·`소매`·`도매 및 소매업`·`도소매` 가 섞여 들어와 **같은 업종인데 키가 달라져**
# 이력이 흩어진다. 업종 추천은 건수 3건·편중 65% 를 둘 다 넘겨야 하므로,
# 쪼개진 이력은 문턱을 못 넘고 미해소로 남는다.
#
# 방식: **정확히 일치할 때만** 바구니로 묶는다(공백·괄호·기호를 지우고 비교).
# 부분일치를 쓰면 `숙박 및 음식점업` 이 `음식점` 에 끌려들어가는 식으로 엉킨다 —
# 세무 자료에서는 넓은 적용보다 정확함이 먼저다.
# **목록에 없는 표기는 그대로 둔다**(바꾸지 않는다) — 모르는 업종을 임의로 합치지 않는다.

업태:
  buckets:
    도소매:
      - 소매
      - 소매업
      - 도매
      - 도매업
      - 도소매
      - 도소매업
      - 도매및소매업
      - 소매및도매업

    음식점:
      # 숙박이 섞인 대분류(`숙박 및 음식점업`)는 넣지 않는다 — 숙박비와 식대는
      # 계정이 갈린다. 그건 아래 별도 바구니로 둔다.
      - 음식
      - 음식업
      - 음식점
      - 음식점업
      - 일반음식점
      - 휴게음식점
      - 식당

    숙박음식대분류:
      # KSIC 대분류라 숙박과 음식이 한 칸에 들어온다. 종목으로 갈리므로 따로 둔다.
      - 숙박및음식점업
      - 숙박음식

    숙박:
      - 숙박
      - 숙박업

    서비스:
      - 서비스
      - 서비스업

    제조:
      - 제조
      - 제조업

    건설:
      - 건설
      - 건설업

    운수:
      - 운송
      - 운송업
      - 운수
      - 운수업

    통신:
      # 통신요금 성격. 정보통신업(SI·소프트웨어)과는 계정이 달라 섞지 않는다.
      - 통신
      - 통신업
      - 전기통신업

    금융:
      # 대개 결제대행·카드사라 대행사 규칙이 먼저 걸러낸다. 표기만 통일한다.
      - 금융
      - 금융업
      - 금융서비스
      - 금융및보험업

    보험:
      - 보험
      - 보험업

    부동산:
      - 부동산
      - 부동산업
      - 부동산및임대업

    교육:
      - 교육
      - 교육서비스업

    보건:
      # 의료비는 개인 수임처에서 업무무관으로 빠지는 일이 많아 따로 본다.
      - 보건
      - 보건업
      - 의료
      - 보건업및사회복지서비스업

종목:
  # 종목은 자유 기술이라 표기가 훨씬 다양하다. 섣불리 묶으면 계정을 틀리게 만들 수
  # 있어 **지금은 비워 둔다**. 필요한 묶음이 확인되면 여기에 적는다(근거는 domain_notes).
  buckets: {}
