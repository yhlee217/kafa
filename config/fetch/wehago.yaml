# 위하고 다운로드 화면 조작 설정 (감독형 수집)
#
# 아래 selector 는 **실화면 기록**(kafa-fetch --inspect --record, 2026-08)으로 확인한 값이다.
# 추측해 넣지 않는다 — 화면이 바뀌면 다시 --record 로 확인해 고친다.
# 근거·기록 요약: docs/decisions.md
#
# ⚠️ **이용약관 확인은 사용자 책임.** 서비스가 자동화 접근을 금지하면 사용하지 말 것.

# 사람이 로그인한 뒤 도달해 있어야 하는 화면(안내 문구에만 쓰임)
start_hint: "수임처 › 회계 › 전표관리 › 신용카드 화면까지 열어 두세요."

# 서버 부담을 줄이기 위한 요청 간 대기(초). 너무 짧게 두지 말 것.
delay_seconds: 3.0
# 요소를 기다리는 최대 시간(밀리초)
timeout_ms: 20000
# 변환 완료 알림을 닫을 때의 대기(없을 수도 있으므로 짧게)
confirm_timeout_ms: 5000

# 기간을 정하는 방식
#   screen   — 화면에 이미 잡혀 있는 기간을 그대로 쓴다. 위하고 기본값이 **기수 전체**
#              (예: 2026.01.01 ~ 2026.12.31)라 1년치를 한 번에 받는다. 달력 조작 불필요.
#   calendar — 달력을 눌러 월 단위로 지정(아래 period_* 보정 필요, 아직 미확정)
period_mode: screen

# 조회 구분 — 신용카드 화면은 매입/매출을 목록에서 고른다.
kind_value: "2. 매입"

selectors:
  # 수임처 선택 — **--master 로 접속 URL 을 주면 아래 둘은 필요 없다**(주소로 바로 이동).
  # URL 형태: https://smarta.wehago.com/#/smarta/account/SAAC0105?sao&cno=<수임처코드>
  client_search_input: TODO      # 거래처 검색 입력창
  client_result_item: TODO       # 검색 결과 항목(이름으로 매칭)

  # 구분(매입/매출) 선택 — 목록을 열고 항목을 고른다
  kind_select_open: "div.LS_saoinput div.LS_ngh_select2 div.fake_inputbox div.fakebutton"
  kind_option: "li.LSnghSelectResult_listitem a:has-text(\"{kind}\")"

  # 조회 — '휴폐업조회' 와 구분하려고 조회 영역 안의 버튼으로 한정한다
  search_button: "div#SAOSearchMain button.LUX_basic_btn.Default.basic"

  # 다운로드 — 툴바의 '엑셀변환'. 누르면 파일이 만들어지고 알림이 뜬다.
  excel_download_button: "td:text-is(\"엑셀변환\")"
  download_confirm: "button#confirm"

  # 달력 방식(period_mode: calendar)으로 월 단위 수집을 하려면 아래를 보정해야 한다.
  # 실화면 기록상 시작일/종료일 모두 '달력 열기' 버튼을 눌러 월 이동 후 날짜를 클릭하는
  # 방식이라 단순 입력(fill)이 되지 않는다. 확정 전까지 screen 모드를 쓴다.
  period_from_input: TODO
  period_to_input: TODO

  # (선택) 결과가 없을 때 나타나는 요소 — 있으면 빈 달을 빨리 건너뛴다
  empty_result_marker: null
  # (선택) 로그인 화면에만 있는 요소. 지정하면 세션 만료를 감지해 사람에게 재로그인을
  # 요청하고 그 건부터 이어서 진행한다(자동 로그인은 하지 않음). 예: "input[type=password]"
  login_marker: null

# 기간 입력 형식(calendar 모드에서만 쓰임).
period_format: "%Y-%m"
