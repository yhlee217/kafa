[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafa"
version = "0.1.0"
description = "위하고 T 신용카드 매입 전표 분류·생성 도구"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlwt>=1.3",
    "xlrd>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
mcp = ["mcp>=1.0"]

[project.scripts]
kafa = "kafa.cli:main"
kafa-mcp = "kafa.mcp_server:main"

[tool.setuptools.packages.find]
include = ["kafa*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
